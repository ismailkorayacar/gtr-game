name: Yeni sürüm bildirimi
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12
      - run: node .github/scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/gtr-game/
